# Supply-chain policy (adr-001 section 5 decision 5, threat row 15).
# Licences: only MIT, Apache-2.0 and BSD. Sources: crates.io only. Advisories block.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# DEVIATION, needs a human decision. sqlx-sqlite (0.9.0, latest) pins libsqlite3-sys below
# 0.38, which bundles SQLite 3.53.x. RUSTSEC-2026-0459 is fixed in libsqlite3-sys 0.39 (SQLite
# 3.54), which sqlx does not yet allow. Exposure per the advisory: only a process that opens a
# database file plus a crafted sibling -wal file written by a less trusted party. minidon opens
# one operator-owned file, never WAL mode (journal_mode is set to DELETE, as Python), and loads
# no extension. Remove this ignore as soon as sqlx allows libsqlite3-sys 0.39 or later.
ignore = ["RUSTSEC-2026-0459"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
]
confidence-threshold = 0.9

private = { ignore = true }

# DEVIATION, needs a human decision (adr-001 section 5 decision 5 allows only MIT, Apache-2.0
# and BSD). These crates cannot be avoided: sqlx-core depends on `url`, which pulls the ICU
# data crates (Unicode-3.0), and `hashbrown` pulls `foldhash` (Zlib). Both licences are
# permissive and OSI approved. Each exception is per crate, so any other crate under these
# licences is still rejected.
exceptions = [
    { allow = ["Unicode-3.0"], crate = "icu_collections" },
    { allow = ["Unicode-3.0"], crate = "icu_locale_core" },
    { allow = ["Unicode-3.0"], crate = "icu_normalizer" },
    { allow = ["Unicode-3.0"], crate = "icu_normalizer_data" },
    { allow = ["Unicode-3.0"], crate = "icu_properties" },
    { allow = ["Unicode-3.0"], crate = "icu_properties_data" },
    { allow = ["Unicode-3.0"], crate = "icu_provider" },
    { allow = ["Unicode-3.0"], crate = "litemap" },
    { allow = ["Unicode-3.0"], crate = "potential_utf" },
    { allow = ["Unicode-3.0"], crate = "tinystr" },
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
    { allow = ["Unicode-3.0"], crate = "writeable" },
    { allow = ["Unicode-3.0"], crate = "yoke" },
    { allow = ["Unicode-3.0"], crate = "yoke-derive" },
    { allow = ["Unicode-3.0"], crate = "zerofrom" },
    { allow = ["Unicode-3.0"], crate = "zerofrom-derive" },
    { allow = ["Unicode-3.0"], crate = "zerotrie" },
    { allow = ["Unicode-3.0"], crate = "zerovec" },
    { allow = ["Unicode-3.0"], crate = "zerovec-derive" },
    { allow = ["Zlib"], crate = "foldhash" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
